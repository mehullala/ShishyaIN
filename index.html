<!DOCTYPE html>
<html>
<head>
  <base href="/ShishyaIN/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Shishya AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  
  <!-- iOS Video Playback Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>shishya_ai</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
  (function(){
    let deferredPrompt;

    function isAppInstalled(){
      return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true
        || window.matchMedia('(display-mode: fullscreen)').matches;
    }

    function createInstallButton(){
      const existing = document.getElementById('install-button');
      if (existing) return existing;
      const button = document.createElement('button');
      button.id = 'install-button';
      button.innerText = 'Install App';
      Object.assign(button.style, {
        position: 'fixed',
        bottom: '20px',
        left: '50%',
        transform: 'translateX(-50%)',
        padding: '12px 24px',
        background: '#000',
        color: '#fff',
        border: 'none',
        borderRadius: '8px',
        zIndex: '9999'
      });
      document.body.appendChild(button);
      return button;
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (isAppInstalled()) return;
      const btn = createInstallButton();
      btn.style.display = 'inline-block';
      btn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (choice && choice.outcome === 'accepted') {
          btn.style.display = 'none';
        }
      }, { once: true });
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      const btn = document.getElementById('install-button');
      if (btn) btn.style.display = 'none';
    });

    function isIos(){
      return /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
    }

    // Fix video playback on iOS Safari
    function fixIOSVideoPlayback() {
      if (!isIos()) return;
      
      // Observe for dynamically added video elements
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.type === 'childList') {
            mutation.addedNodes.forEach(function(node) {
              if (node.nodeType === 1) { // Element node
                const videos = node.querySelectorAll ? node.querySelectorAll('video') : [];
                videos.forEach(function(video) {
                  if (!video.hasAttribute('crossorigin')) {
                    video.setAttribute('crossorigin', 'anonymous');
                  }
                  if (!video.hasAttribute('playsinline')) {
                    video.setAttribute('playsinline', '');
                  }
                  if (!video.hasAttribute('webkit-playsinline')) {
                    video.setAttribute('webkit-playsinline', '');
                  }
                });
              }
            });
          }
        });
      });

      observer.observe(document.body, {
        childList: true,
        subtree: true
      });

      // Also handle existing video elements on page load
      document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('video').forEach(function(video) {
          if (!video.hasAttribute('crossorigin')) {
            video.setAttribute('crossorigin', 'anonymous');
          }
          if (!video.hasAttribute('playsinline')) {
            video.setAttribute('playsinline', '');
          }
          if (!video.hasAttribute('webkit-playsinline')) {
            video.setAttribute('webkit-playsinline', '');
          }
        });
      });
    }

    fixIOSVideoPlayback();

    document.addEventListener('DOMContentLoaded', () => {
      if (isAppInstalled()) {
        const btn = document.getElementById('install-button');
        if (btn) btn.style.display = 'none';
        return;
      }
      if (isIos()) {
        const btn = createInstallButton();
        btn.addEventListener('click', () => {
          alert('To install on iOS: tap Share, then "Add to Home Screen"');
        });
      }
    });
  })();
  </script>
</body>
</html>
