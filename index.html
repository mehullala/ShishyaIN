<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/ShishyaIN/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="shishya_ai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">


  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>shishya_ai</title>
  <link rel="manifest" href="manifest.json">
  <script>
  (function() {
    function setPlaysInline(el) {
      try {
        el.setAttribute('playsinline', '');
        el.setAttribute('webkit-playsinline', '');
      } catch (e) {}
    }

    // Fix existing videos
    document.querySelectorAll('video').forEach(setPlaysInline);

    // Observe and fix dynamically added videos (used by video_player web builds)
    new MutationObserver(function(mutations) {
      mutations.forEach(function(m) {
        m.addedNodes.forEach(function(node) {
          if (!node) return;
          if (node.tagName === 'VIDEO') setPlaysInline(node);
          else if (node.querySelectorAll) node.querySelectorAll('video').forEach(setPlaysInline);
        });
      });
    }).observe(document.documentElement || document.body, { childList: true, subtree: true });
  })();
</script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
  (function(){
    let deferredPrompt;

    function isAppInstalled(){
      return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true
        || window.matchMedia('(display-mode: fullscreen)').matches;
    }

    function createInstallButton(){
      const existing = document.getElementById('install-button');
      if (existing) return existing;
      const button = document.createElement('button');
      button.id = 'install-button';
      button.innerText = 'Install App';
      Object.assign(button.style, {
        position: 'fixed',
        bottom: '20px',
        left: '50%',
        transform: 'translateX(-50%)',
        padding: '12px 24px',
        background: '#000',
        color: '#fff',
        border: 'none',
        borderRadius: '8px',
        zIndex: '9999'
      });
      document.body.appendChild(button);
      return button;
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (isAppInstalled()) return;
      const btn = createInstallButton();
      btn.style.display = 'inline-block';
      btn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (choice && choice.outcome === 'accepted') {
          btn.style.display = 'none';
        }
      }, { once: true });
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      const btn = document.getElementById('install-button');
      if (btn) btn.style.display = 'none';
    });

    function isIos(){
      return /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (isAppInstalled()) {
        const btn = document.getElementById('install-button');
        if (btn) btn.style.display = 'none';
        return;
      }
      if (isIos()) {
        const btn = createInstallButton();
        btn.addEventListener('click', () => {
          alert('To install on iOS: tap Share, then "Add to Home Screen"');
        });
      }
    });
  })();
  </script>
</body>
</html>
